name: E2E

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - cmd/**
      - internal/**
      - auto-trust.sh
      - init-vault.sh

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run e2e tests
        run: test/e2e_test.sh

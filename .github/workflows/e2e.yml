name: e2e

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - cmd/**
      - internal/**
      - auto-trust.sh
      - init-vault.sh
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Start container
        run: docker compose up -d

      - name: Wait for services
        run: |
          timeout=90
          started=$(date +%s)
          while [ "$(($(date +%s) - started))" -lt "$timeout" ]; do
            logs=$(docker compose logs --tail=50 2>&1)

            if echo "$logs" | grep -q "SIGSEGV"; then
              echo "FAIL: Obsidian crashed"
              docker compose logs
              exit 1
            fi

            auto_trust=$(echo "$logs" | grep -c "REST API is up" || true)
            mcp=$(curl -s --max-time 3 http://localhost:4000/sse | grep -c "sessionId" || true)

            if [ "$auto_trust" -gt 0 ] && [ "$mcp" -gt 0 ]; then
              echo "PASS: auto-trust and MCP bridge up"
              exit 0
            fi
            sleep 3
          done
          echo "FAIL: timeout"
          docker compose logs
          exit 1

      - name: Verify MCP tools
        run: |
          session=$(curl -s --max-time 3 http://localhost:4000/sse | grep -o 'sessionId=[a-f0-9-]*' | head -1)
          result=$(curl -s --max-time 5 -X POST "http://localhost:4000/message?${session}" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "$result" | grep -q "obsidian" && echo "PASS: tools available"

      - name: Cleanup
        if: always()
        run: docker compose down
